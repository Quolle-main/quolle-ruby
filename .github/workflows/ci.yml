name: CI
on:
  push:
  pull_request:
  # Weekly on ubuntu-latest, so a runner or toolchain change fails on a quiet
  # Monday instead of on the next pull request.
  schedule:
    - cron: "17 6 * * 1"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The gemspec minimum, and the newest release.
        ruby: ["3.3", "ruby"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install minitest
      - run: ruby -Ilib -Itest -e 'Dir.glob("test/test_*.rb").each { |f| require File.expand_path(f) }'
